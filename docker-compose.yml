services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3150:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    networks:
      - dokploy-network

volumes:
  uploads:

networks:
  dokploy-network:
    external: true
